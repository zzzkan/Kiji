name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet filter (e.g. *MarkdownRenderBenchmarks*)"
        required: false
        default: "*"
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  microbenchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run Kiji.Benchmarks
        run: >
          dotnet run -c Release --project benchmarks/Kiji.Benchmarks --
          --filter "${{ github.event.inputs.filter || '*' }}"
          --exporters json

      - name: Publish run summary
        if: always()
        run: cat BenchmarkDotNet.Artifacts/results/*-report-github.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/
