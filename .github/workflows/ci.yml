name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

  # A scaffolded site references the Kiji version being built, which is not on nuget.org,
  # so this cannot be a unit test: it has to pack first and restore from a local feed.
  verify-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack -c Release -o artifacts

      - name: Scaffold a site
        run: |
          dotnet new install artifacts/Kiji.Templates.*.nupkg
          dotnet new kiji -o /tmp/Sample --siteName 'Sample Site' --baseUrl 'https://example.com/sample/'

      # Proves the packed version substitution, the CPM stoppers, and that .razor
      # compiles against Kiji as a package rather than a project reference.
      - name: Build and generate it
        run: |
          dotnet restore /tmp/Sample -s "$GITHUB_WORKSPACE/artifacts" -s https://api.nuget.org/v3/index.json
          dotnet build /tmp/Sample -c Release --no-restore
          dotnet run --project /tmp/Sample -c Release --no-build -- build

      - name: Check the generated site
        run: |
          for file in index.html hello-world/index.html 404.html sitemap.xml css/app.css; do
            test -f "/tmp/Sample/dist/$file" || { echo "missing: dist/$file"; exit 1; }
          done
          # --baseUrl has to reach the markup, and no <base> element may appear:
          # it would re-root the document-relative page-bundle image URLs.
          grep -q 'href="/sample/css/app.css"' /tmp/Sample/dist/index.html
          ! grep -q '<base' /tmp/Sample/dist/index.html

      # The defaults are what most users get, so check they substitute too.
      - name: Scaffold with defaults
        run: |
          dotnet new kiji -o /tmp/Defaults
          test -f /tmp/Defaults/Defaults.csproj || { echo "project was not renamed"; exit 1; }
          ! grep -qE 'SITE_NAME|SITE_BASE_URL' /tmp/Defaults/Program.cs
