name: "🐛 Bug report"
description: "Report a problem with Kiji."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first and include
        a small reproduction when possible. Remove secrets from logs and attachments.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues for this problem.
          required: true
  - type: input
    id: version
    attributes:
      label: Kiji version
      description: "Which NuGet package version or source commit are you using?"
      placeholder: "e.g. 0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Build or publish
        - Watch or development server
        - Routing or rendering
        - Markdown or content
        - Images
        - Feeds or sitemap
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: "Describe the behavior you observed, including any error message."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: "Include the smallest project or code sample that reproduces the problem, if possible."
      placeholder: |
        1. Create a site with ...
        2. Run dotnet publish ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Operating system, .NET SDK version, and anything else that may matter."
      placeholder: "e.g. Windows 11, .NET SDK 10.0.x"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Paste relevant output without Markdown fences. Remove secrets first."
      render: shell
  - type: upload
    id: attachments
    attributes:
      label: Screenshots or files
      description: "Attach screenshots or a minimal reproduction archive if useful."
    validations:
      accept: ".png,.jpg,.jpeg,.webp,.gif,.zip,.log,.txt"
