name: "✨ Feature request"
description: "Suggest a new capability or improvement."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Please describe the problem or use case before proposing a solution."
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues for this request.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Build or publish
        - Watch or development server
        - Routing or rendering
        - Markdown or content
        - Images
        - Feeds or sitemap
        - Other
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do?
      description: "Describe the use case and what prevents it today."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: "What should Kiji do? Include a short API or usage example if helpful."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: "What have you tried, and what tradeoffs did you find?"
