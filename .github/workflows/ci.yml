name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Repository checks
        working-directory: tests/Kiji.RepositoryTests
        run: dotnet test -c Release

      - name: Library tests
        shell: pwsh
        run: |
          foreach ($project in Get-ChildItem tests -Directory -Filter '*.Tests') {
            Push-Location $project.FullName
            dotnet test -c Release
            $code = $LASTEXITCODE
            Pop-Location
            if ($code) { exit $code }
          }

      - name: Pack
        shell: pwsh
        run: |
          dotnet pack src/Kiji -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem artifacts/packages -Filter 'Kiji.*.nupkg' | Where-Object { -not $_.Name.StartsWith('Kiji.Runtime.') })
          if ($packages.Count -ne 1) { throw 'Expected exactly one Kiji package.' }
          $runtimePackages = @(Get-ChildItem artifacts/packages -Filter 'Kiji.Runtime.*.nupkg')
          if ($runtimePackages.Count -ne 6) { throw "Expected six Kiji.Runtime packages, found $($runtimePackages.Count)." }
          "KIJI_TEST_PACKAGE=$($packages[0].FullName)" >> $env:GITHUB_ENV

      - name: Package scenarios
        timeout-minutes: 10
        working-directory: tests/Kiji.PackageTests
        shell: pwsh
        env:
          KIJI_TEST_TRACE: ${{ runner.temp }}/package-scenarios.log
        run: |
          New-Item -ItemType File -Force $env:KIJI_TEST_TRACE | Out-Null
          $test = Start-Process dotnet -ArgumentList 'test', '-c', 'Release' -NoNewWindow -PassThru
          $null = $test.Handle
          $trace = [IO.StreamReader]::new([IO.FileStream]::new($env:KIJI_TEST_TRACE, 'Open', 'Read', 'ReadWrite'))
          while (-not $test.HasExited) {
            while ($null -ne ($line = $trace.ReadLine())) { $line }
            Start-Sleep -Milliseconds 500
          }
          while ($null -ne ($line = $trace.ReadLine())) { $line }
          exit $test.ExitCode

      - name: Build docs
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          dotnet publish docs -c Release --no-build -o docs/dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $republish = dotnet publish docs -c Release --no-build -o docs/dist | Out-String
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($republish -notmatch 'Generated 0 pages') { $republish; throw 'A publish with no changes rendered pages.' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error
          retention-days: 1

  portable-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Portable cache
        run: dotnet pwsh tests/PortableCache/Verify-PortableCache.ps1
