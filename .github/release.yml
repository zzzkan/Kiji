# GitHub uses these PR labels when "Generate release notes" is selected.
# A PR without a matching label appears under Other changes.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 💥 Breaking changes
      labels:
        - breaking-change
    - title: ✨ Features
      labels:
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🔧 Other changes
      labels:
        - '*'
