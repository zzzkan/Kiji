name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the package version from git tags and history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/Kiji/Kiji.csproj -c Release --no-build -o artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push "artifacts/Kiji.*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # A successful push can precede NuGet.org's public index by a few minutes. Wait
      # until the released version is installable before publishing documentation that
      # points readers at it.
      - name: Wait for NuGet.org indexing
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${PACKAGE_VERSION#v}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
                https://api.nuget.org/v3-flatcontainer/kiji/index.json \
                | jq --exit-status --arg version "$version" \
                    '.versions | index($version) != null' > /dev/null; then
              echo "Kiji $version is available on NuGet.org."
              exit 0
            fi

            echo "Waiting for Kiji $version to appear on NuGet.org ($attempt/30)..."
            sleep 10
          done

          echo "Kiji $version did not appear on NuGet.org within five minutes." >&2
          exit 1

  deploy-docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
