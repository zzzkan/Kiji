name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Share dependencies on the checkout volume so CopyLocal can use hard links.
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer derives the package version from git tags and history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Library tests
        working-directory: src/Kiji.Tests
        run: dotnet test -c Release

      - name: Pack
        shell: pwsh
        run: |
          dotnet pack src/Kiji -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem artifacts/packages -Filter '*.nupkg')
          if ($packages.Count -ne 1) { throw 'Expected exactly one Kiji package.' }
          "KIJI_TEST_PACKAGE=$($packages[0].FullName)" >> $env:GITHUB_ENV

      - name: Package scenarios
        working-directory: src/Kiji.PackageTests
        run: dotnet test -c Release

      - name: Build docs
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish docs -c Release --no-build -o docs/dist

      # Upload once per PR run; Docs Deploy waits for the entire CI matrix.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error
          retention-days: 1
