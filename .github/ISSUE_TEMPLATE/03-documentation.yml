name: "📚 Documentation issue"
description: "Report unclear, missing, or incorrect documentation."
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or topic
      description: "Link to the page or name the topic that needs documentation."
      placeholder: "e.g. https://kiji-docs.zzzkan.workers.dev/docs/getting-started/"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or missing?
      description: "Quote the relevant part or explain where you got stuck."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: "Describe the correction or example you would like to see."
