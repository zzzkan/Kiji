name: Docs Deploy

on:
  workflow_run:
    workflows: [Docs Build]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve deployment target
        id: target
        env:
          EVENT_NAME: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_number="$(tr -d '\r\n' < .docs-deploy/pr-number)"
            if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid pull request number: $pr_number" >&2
              exit 1
            fi
            echo "command=versions upload --preview-alias pr-$pr_number --config wrangler.jsonc" >> "$GITHUB_OUTPUT"
            echo "preview_url=https://pr-${pr_number}-kiji-docs.zzzkan.workers.dev/" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          else
            echo "command=deploy --config wrangler.jsonc" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.135.0"
          command: ${{ steps.target.outputs.command }}

      - name: Add preview link to pull request
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.target.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- kiji-docs-preview -->";
            const issue_number = Number(process.env.PR_NUMBER);
            const body = `${marker}\nDocs preview: ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const previous = comments.find(comment =>
              comment.user?.type === "Bot" && comment.body?.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
